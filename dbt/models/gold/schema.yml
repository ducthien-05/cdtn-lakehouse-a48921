version: 2
models:
- name: dim_date
  description: Calendar dimension used by order and review date keys.
  columns:
  - name: date_key
    data_type: int
    data_tests:
    - not_null
    - unique
  - name: calendar_date
    data_type: date
  - name: calendar_year
    data_type: int
    data_tests:
    - not_null
  - name: calendar_quarter
    data_type: int
    data_tests:
    - not_null
  - name: calendar_month
    data_type: int
    data_tests:
    - not_null
  - name: month_name
    data_type: string
    data_tests:
    - not_null
  - name: week_of_year
    data_type: int
    data_tests:
    - not_null
  - name: day_of_month
    data_type: int
    data_tests:
    - not_null
  - name: day_of_week
    data_type: int
    data_tests:
    - not_null

