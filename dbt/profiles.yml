# Local-only Thrift endpoint. No PostgreSQL or S3 secrets belong in this file.
# dbt-spark renders schema.table; Spark's default catalog supplies lakehouse.
olist_lakehouse:
  target: probe
  outputs:
    probe: &spark_connection
      type: spark
      method: thrift
      host: "{{ env_var('DBT_SPARK_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_SPARK_PORT', '10000') | int }}"
      user: dbt
      schema: dbt_probe_20261117
      auth: NOSASL
      threads: 1
      connect_retries: 3
      connect_timeout: 10
      retry_all: false
      query_timeout: 120
      query_retries: 0
      poll_interval: 1
      server_side_parameters:
        spark.sql.defaultCatalog: lakehouse
        spark.sql.session.timeZone: UTC
    silver:
      <<: *spark_connection
      schema: silver
    gold:
      <<: *spark_connection
      schema: gold
