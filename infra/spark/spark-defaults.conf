# Spark 3.5.9 / Scala 2.12, Iceberg 1.12.0, local runner for the Olist workload.
spark.master local[2]
spark.sql.shuffle.partitions 2
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.jars.packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.12.0,org.apache.iceberg:iceberg-aws-bundle:1.12.0,org.postgresql:postgresql:42.7.14,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
spark.jars.ivy /tmp/ivy-cache
spark.sql.catalog.lakehouse org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type jdbc
spark.sql.catalog.lakehouse.uri jdbc:postgresql://postgres-catalog:5432/iceberg_catalog
spark.sql.catalog.lakehouse.jdbc.user iceberg
spark.sql.catalog.lakehouse.jdbc.schema-version V1
spark.sql.catalog.lakehouse.jdbc.init-catalog-tables false
spark.sql.catalog.lakehouse.warehouse s3://olist-lakehouse/warehouse
spark.sql.catalog.lakehouse.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.client.region us-east-1
# JDBC password is appended only inside the container from ICEBERG_CATALOG_PASSWORD.
# S3 credentials are supplied through AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
