# Serving profile: Superset metadata DB and Superset web UI.
# Merge after foundation and lakehouse so Superset reaches Trino by service name.
services:
  postgres-superset:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:?Set SUPERSET_DB_PASSWORD in .env}
    volumes:
      - superset_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  superset-init:
    build:
      context: ./superset
      dockerfile: Dockerfile
    depends_on:
      postgres-superset:
        condition: service_healthy
      trino:
        condition: service_healthy
    environment: &superset-environment
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      SUPERSET_METADATA_DATABASE_URI: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD}@postgres-superset:5432/superset
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?Set SUPERSET_DB_PASSWORD in .env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
      SUPERSET_ADMIN_FIRST_NAME: ${SUPERSET_ADMIN_FIRST_NAME:-Admin}
      SUPERSET_ADMIN_LAST_NAME: ${SUPERSET_ADMIN_LAST_NAME:-User}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@localhost}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        superset db upgrade
        superset fab create-admin \
          --username "$${SUPERSET_ADMIN_USERNAME}" \
          --firstname "$${SUPERSET_ADMIN_FIRST_NAME}" \
          --lastname "$${SUPERSET_ADMIN_LAST_NAME}" \
          --email "$${SUPERSET_ADMIN_EMAIL}" \
          --password "$${SUPERSET_ADMIN_PASSWORD}" || true
        superset init
    restart: "no"

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    environment:
      <<: *superset-environment
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - /bin/sh
      - -ec
      - >-
        gunicorn --bind 0.0.0.0:8088 --workers 1 --threads 4 --timeout 120
        'superset.app:create_app()'
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8088/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  superset_metadata_data:
